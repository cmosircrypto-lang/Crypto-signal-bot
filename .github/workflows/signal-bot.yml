name: Crypto Signal Bot

on:
  workflow_dispatch:
  # schedule غیرفعال شد (cron-job.org مدیریت می‌کند)

concurrency:
  group: signal-bot
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          path: repo
          ref: main
          fetch-depth: 1

      - name: Checkout state branch (data)
        uses: actions/checkout@v4
        with:
          path: state
          ref: state
          fetch-depth: 1
        continue-on-error: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: repo/requirements.txt

      - name: Install dependencies
        working-directory: repo
        run: pip install -r requirements.txt

      - name: Restore state files from state branch
        run: |
          if [ -d "state" ]; then
            cp state/server_messages*.json   repo/ 2>/dev/null || true
            cp state/last_signals*.json      repo/ 2>/dev/null || true
            cp state/trades_bot*.csv         repo/ 2>/dev/null || true
            cp state/signals_bot*.xlsx       repo/ 2>/dev/null || true
            cp state/daily_summary.json      repo/ 2>/dev/null || true
            echo "✅ State restored from state branch"
          else
            echo "⚠️ No state branch yet, starting fresh"
          fi

      - name: Run all bots
        working-directory: repo
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
          TOOBIT_SECRET: ${{ secrets.TOOBIT_SECRET }}
        run: python main.py

      - name: Commit state to state branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p state
          for f in server_messages*.json last_signals*.json trades_bot*.csv signals_bot*.xlsx daily_summary.json; do
            if [ -f "repo/$f" ]; then
              cp -f "repo/$f" "state/$f"
            fi
          done

          cd state
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          git add -A

          if ! git diff --staged --quiet; then
            git commit -m "state update $(date -u +%Y-%m-%dT%H:%MZ)"
            if ! git push origin state; then
              echo "⚠️ First push failed, trying with rebase..."
              git pull --rebase origin state
              git push origin state
            fi
          else
            echo "No state changes"
          fi