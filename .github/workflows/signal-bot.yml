name: Crypto Signal Bot

on:
  schedule:
    - cron: '*/15 * * * *'   # هر ۱۵ دقیقه
  workflow_dispatch:

concurrency:
  group: signal-bot-2
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run all bots (main.py)
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          TOOBIT_API_KEY: ${{ secrets.TOOBIT_API_KEY }}
          TOOBIT_SECRET: ${{ secrets.TOOBIT_SECRET }}
        run: python main.py

      - name: Compare bots performance
        if: always()
        run: |
          if [ -f compare_bots.py ]; then
            python compare_bots.py --min-trades 100 --export ranking.csv || true
          fi

      - name: Commit state + trade logs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # وضعیت ربات‌ها
          for f in server_messages*.json last_signals*.json daily_summary.json; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          # لاگ معاملات برای ارزیابی ۱۰۰تایی
          for f in trades_bot*.csv ranking.csv signals_bot*.xlsx; do
            if [ -f "$f" ]; then git add "$f"; fi
          done

          if ! git diff --staged --quiet; then
            git commit -m "Update state & trade logs $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main || true
            git push
          else
            echo "No changes to commit"
          fi
