name: Genetic Family Multi-Symbol Research

on:
  push:
    branches:
      - experiment/dynamic-signal-selection-design
    paths:
      - ".github/workflows/genetic-family-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multi-symbol-smoke:
    name: ${{ matrix.symbol }} LONG + SHORT
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        symbol:
          - BTC-USDT-SWAP
          - ETH-USDT-SWAP
          - BNB-USDT-SWAP
          - SOL-USDT-SWAP
          - XRP-USDT-SWAP
          - ADA-USDT-SWAP
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pandas numpy
      - name: Download validated 76-symbol OKX dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" --pattern "okx_data.tar" --dir /tmp
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" --pattern "okx_timeframes.tar" --dir /tmp
          mkdir -p Backtest/data/okx
          tar -xf /tmp/okx_data.tar -C Backtest/data/okx
          tar -xf /tmp/okx_timeframes.tar -C Backtest/data/okx
          for timeframe in 15m 1h 4h; do
            count=$(find "Backtest/data/okx/$timeframe" -maxdepth 1 -name '*.csv.gz' | wc -l)
            echo "$timeframe: $count symbol files"
            test "$count" -eq 76
          done
      - name: Run independent LONG and SHORT genetic evolution
        run: |
          set -o pipefail
          python -u -m Backtest.GeneticEngine.run_genetic_research \
            --profile smoke --symbols "${{ matrix.symbol }}" --population 10 --generations 3 \
            | tee "/tmp/genetic-family-${{ matrix.symbol }}.log"
      - name: Add report to summary
        if: always()
        run: |
          if [ -f "/tmp/genetic-family-${{ matrix.symbol }}.log" ]; then
            {
              echo "## ${{ matrix.symbol }} family-genetic research"
              tail -n 100 "/tmp/genetic-family-${{ matrix.symbol }}.log"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload checkpoints and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genetic-family-${{ matrix.symbol }}-pop10-gen3
          path: |
            Backtest/results/genetic_family_checkpoints/
            Backtest/results/genetic_family_summary.json
            /tmp/genetic-family-${{ matrix.symbol }}.log
          if-no-files-found: warn
          retention-days: 30
