name: Dynamic Signal Selection Tests

on:
  push:
    branches:
      - experiment/dynamic-signal-selection-design
    paths:
      - "Backtest/GeneticEngine/config.py"
      - "Backtest/GeneticEngine/genome.py"
      - "Backtest/GeneticEngine/dynamic_selector.py"
      - "Backtest/GeneticEngine/checkpoint.py"
      - "Backtest/GeneticEngine/dynamic_cycle_runner.py"
      - "Backtest/GeneticEngine/tests/test_dynamic_selection.py"
      - "Backtest/GeneticEngine/tests/test_dynamic_cycle_runner.py"
      - "Backtest/GeneticEngine/tests/test_strategy_family_genome.py"
      - "Backtest/GeneticEngine/README.md"
      - ".github/workflows/dynamic-signal-selection-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile research modules
        run: |
          python -m py_compile \
            Backtest/GeneticEngine/config.py \
            Backtest/GeneticEngine/genome.py \
            Backtest/GeneticEngine/dynamic_selector.py \
            Backtest/GeneticEngine/checkpoint.py \
            Backtest/GeneticEngine/dynamic_cycle_runner.py
      - name: Test dynamic selector and checkpointing
        run: python -m unittest Backtest.GeneticEngine.tests.test_dynamic_selection
      - name: Test resumable per-symbol cycle runner
        run: python -m unittest Backtest.GeneticEngine.tests.test_dynamic_cycle_runner
      - name: Test composable strategy-family genome
        run: python -m unittest Backtest.GeneticEngine.tests.test_strategy_family_genome
      - name: Test existing genome contract
        run: python -m unittest Backtest.GeneticEngine.tests.test_genome
