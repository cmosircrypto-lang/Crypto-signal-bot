name: Run 1-Year Backtest (Subset)

on:
  workflow_dispatch:   # فقط دستی اجرا میشه

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: pip install ccxt pandas pyarrow tqdm openpyxl jdatetime requests

      - name: Download data (20 symbols, 1 year)
        run: python download_data.py --subset --days 365

      - name: Run backtest engine
        run: python backtest_engine.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest_results.csv
            data/*.parquet
          retention-days: 7