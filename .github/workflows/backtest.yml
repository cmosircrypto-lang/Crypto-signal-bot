name: Backtest

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "تاریخ پایان بک‌تست (UTC، مثل 2026-11-17)"
        required: true
        default: "2026-11-17"
      days:
        description: "طول بک‌تست (روز)"
        required: true
        default: "365"
      step_minutes:
        description: "فاصله اجرای ربات‌ها (دقیقه، مضرب ۱۵)"
        required: true
        default: "60"

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: Backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy requests

      # داده‌ی دانلودشده‌ی قبلی (اگر باشد) برگردانده می‌شود تا دانلود مجدد لازم نباشد
      - name: Restore cached OKX data
        uses: actions/cache@v4
        with:
          path: Backtest/data/okx
          key: okx-data-${{ inputs.end_date }}-${{ github.run_id }}
          restore-keys: |
            okx-data-${{ inputs.end_date }}-
            okx-data-

      - name: Download OKX data (فقط بخش‌های ناقص)
        run: python download_okx_data.py --end "${{ inputs.end_date }}" --days "${{ inputs.days }}"

      - name: Run backtest
        run: |
          python backtest_bots.py --days "${{ inputs.days }}" --end "${{ inputs.end_date }}" \
            --step-minutes "${{ inputs.step_minutes }}" | tee report_full.txt
          sed -n '/نتایج بک‌تست/,$p' report_full.txt > report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            backtest/backtest_results/
            backtest/report.txt
