name: Backtest

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "تاریخ پایان بک‌تست (UTC، مثل 2026-11-17)"
        required: true
        default: "2026-11-17"
      days:
        description: "طول بک‌تست (روز)"
        required: true
        default: "365"
      step_minutes:
        description: "فاصله اجرای ربات‌ها (دقیقه، مضرب ۱۵)"
        required: true
        default: "15"
      overrides:
        description: "تغییر پارامترها (اختیاری)، مثل: RISK_PERCENT=1 MAX_LEVERAGE=10 B1_MIN_SCORE=0.75"
        required: false
        default: ""
      bots:
        description: "فقط این ربات‌ها (اختیاری، با فاصله)، مثل: crypto-signal-bot-v60 crypto-signal-bot-v60a"
        required: false
        default: ""

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: Backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy requests

      - name: Restore cached OKX data
        uses: actions/cache/restore@v4
        with:
          path: Backtest/data/okx
          key: okx-data-${{ github.run_id }}
          restore-keys: okx-data-

      - name: Download OKX data (فقط بخش‌های ناقص)
        run: python download_okx_data.py --end "${{ inputs.end_date }}" --days "${{ inputs.days }}"

      # بلافاصله بعد از دانلود ذخیره می‌شود، حتی اگر بک‌تست خطا بدهد
      - name: Save OKX data cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Backtest/data/okx
          key: okx-data-${{ github.run_id }}

      - name: Run backtest
        env:
          OVERRIDES: ${{ inputs.overrides }}
          BOTS: ${{ inputs.bots }}
        run: |
          EXTRA=""
          [ -n "$OVERRIDES" ] && EXTRA="$EXTRA --set $OVERRIDES"
          [ -n "$BOTS" ] && EXTRA="$EXTRA --bots $BOTS"
          python backtest_bots.py --days "${{ inputs.days }}" --end "${{ inputs.end_date }}" \
            --step-minutes "${{ inputs.step_minutes }}" $EXTRA | tee report_full.txt
          sed -n '/نتایج بک‌تست/,$p' report_full.txt > report.txt
          { echo "overrides: ${OVERRIDES:-none} | bots: ${BOTS:-all}"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            Backtest/backtest_results/
            Backtest/report.txt
          if-no-files-found: error
