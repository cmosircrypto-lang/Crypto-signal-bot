name: Backtest Engine

on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout main (code)
        uses: actions/checkout@v4
        with:
          path: repo
          ref: main
          fetch-depth: 1
          lfs: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: repo/requirements.txt

      - name: Install dependencies
        working-directory: repo
        run: pip install ccxt pandas pyarrow tqdm jdatetime openpyxl requests

      - name: Run download_data
        working-directory: repo
        run: python download_data.py

      - name: Commit data to repo
        working-directory: repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          
          # تنظیم LFS (در صورت نیاز)
          git lfs install
          
          git add data/
          if ! git diff --staged --quiet; then
            git commit -m "chore: add historical data ($(date -u +%Y-%m-%d))"
            git push origin main
            echo "✅ Data committed to repo"
          else
            echo "⏩ No new data to commit"
          fi

      - name: Run backtest_engine
        working-directory: repo
        run: python backtest_engine.py

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: repo/backtest_results.csv
          retention-days: 7