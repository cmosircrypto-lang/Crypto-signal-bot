name: Backtest

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "تاریخ پایان بک‌تست (UTC، مثل 2026-11-17)"
        required: true
        default: "2026-11-17"
      days:
        description: "طول بک‌تست (روز)"
        required: true
        default: "365"
      step_minutes:
        description: "فاصله اجرای ربات‌ها (دقیقه، مضرب ۱۵)"
        required: true
        default: "15"
      overrides:
        description: "تغییر پارامترها (اختیاری)، مثل: RISK_PERCENT=1 MAX_LEVERAGE=10 B1_MIN_SCORE=0.75"
        required: false
        default: ""
      bots:
        description: "فقط این ربات‌ها (اختیاری، با فاصله)، مثل: crypto-signal-bot-v60 crypto-signal-bot-v60a"
        required: false
        default: ""

permissions:
  contents: write   # برای ذخیره‌ی دائمی داده‌ی OKX در Releases

env:
  DATA_RELEASE: okx-data          # نام Release (و تگ) نگهدارنده‌ی داده
  DATA_ASSET: okx_data.tar        # نام فایل داخل Release

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: Backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy requests

      # ۱) داده‌ی ذخیره‌شده‌ی قبلی را از Release برمی‌گرداند (اگر باشد)
      - name: Restore OKX data from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p data/okx
          if gh release view "$DATA_RELEASE" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$DATA_RELEASE" --repo "${{ github.repository }}" \
              --pattern "$DATA_ASSET" --dir /tmp --clobber || echo "asset not found"
            if [ -f "/tmp/$DATA_ASSET" ]; then
              tar -xf "/tmp/$DATA_ASSET" -C data/okx
              echo "Restored cached data:"; du -sh data/okx
            fi
          else
            echo "No cached data yet — first run will download everything."
          fi

      # ۲) فقط بخش‌های ناقص (جدیدتر/قدیمی‌تر از داده‌ی موجود) دانلود می‌شود
      - name: Download OKX data (فقط بخش‌های ناقص)
        run: python download_okx_data.py --end "${{ inputs.end_date }}" --days "${{ inputs.days }}"

      # ۳) بلافاصله بعد از دانلود در Release ذخیره می‌شود، حتی اگر بک‌تست خطا بدهد
      - name: Save OKX data to Release
        if: always() && hashFiles('Backtest/data/okx/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -cf "/tmp/$DATA_ASSET" -C data/okx .
          ls -lh "/tmp/$DATA_ASSET"
          gh release view "$DATA_RELEASE" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$DATA_RELEASE" --repo "${{ github.repository }}" \
              --title "OKX data cache" --notes "کش داده‌ی کندل OKX برای بک‌تست. حذف نکن." \
              --prerelease --latest=false
          gh release upload "$DATA_RELEASE" "/tmp/$DATA_ASSET" --repo "${{ github.repository }}" --clobber

      - name: Run backtest
        env:
          OVERRIDES: ${{ inputs.overrides }}
          BOTS: ${{ inputs.bots }}
        run: |
          EXTRA=""
          [ -n "$OVERRIDES" ] && EXTRA="$EXTRA --set $OVERRIDES"
          [ -n "$BOTS" ] && EXTRA="$EXTRA --bots $BOTS"
          python -u backtest_bots.py --days "${{ inputs.days }}" --end "${{ inputs.end_date }}" \
            --step-minutes "${{ inputs.step_minutes }}" $EXTRA | tee report_full.txt
          sed -n '/نتایج بک‌تست/,$p' report_full.txt > report.txt
          { echo "overrides: ${OVERRIDES:-none} | bots: ${BOTS:-all}"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            Backtest/backtest_results/
            Backtest/report.txt
          if-no-files-found: error
