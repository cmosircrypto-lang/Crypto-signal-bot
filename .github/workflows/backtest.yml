name: Backtest

on:
  workflow_dispatch:
    inputs:
      exchange:
        description: "صرافی منبع داده"
        required: true
        type: choice
        options:
          - toobit
          - okx
        default: toobit
      end_date:
        description: "تاریخ پایان بک‌تست (UTC، مثل 2026-11-17)"
        required: true
        default: "2026-11-17"
      days:
        description: "طول بک‌تست (روز)"
        required: true
        default: "365"
      step_minutes:
        description: "فاصله اجرای ربات‌ها (دقیقه، مضرب ۱۵)"
        required: true
        default: "60"
      overrides:
        description: "تغییر پارامترها (اختیاری)، مثل: RECOVERY_ENABLED=0 RISK_PERCENT=1"
        required: false
        default: ""
      top_liquid:
        description: "فقط N نماد پرنقدینگی (بر اساس ۳۰ روز قبل از شروع)، مثل 10. خالی = همه"
        required: false
        default: ""
      random_baseline:
        description: "آزمون ورود تصادفی بعد از بک‌تست؟ (yes = اجرا شود، خالی = نه)"
        required: false
        default: ""
      bots:
        description: "فقط این ربات‌ها (اختیاری، با فاصله)، مثل: crypto-signal-bot-v70a"
        required: false
        default: ""

permissions:
  contents: write   # برای ذخیره‌ی دائمی داده در Releases

env:
  EXCHANGE: ${{ inputs.exchange }}
  DATA_RELEASE: ${{ inputs.exchange }}-data      # okx-data  یا  toobit-data
  DATA_ASSET: ${{ inputs.exchange }}_data.tar    # okx_data.tar  یا  toobit_data.tar

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    defaults:
      run:
        working-directory: Backtest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pandas numpy requests

      # ۱) داده‌ی ذخیره‌شده‌ی قبلی را از Release برمی‌گرداند (اگر باشد)
      - name: Restore data from Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "data/$EXCHANGE"
          if gh release view "$DATA_RELEASE" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release download "$DATA_RELEASE" --repo "${{ github.repository }}" \
              --pattern "$DATA_ASSET" --dir /tmp --clobber || echo "asset not found"
            if [ -f "/tmp/$DATA_ASSET" ]; then
              tar -xf "/tmp/$DATA_ASSET" -C "data/$EXCHANGE"
              echo "Restored cached data:"; du -sh "data/$EXCHANGE"
            fi
          else
            echo "No cached data yet — first run will download everything."
          fi

      # ۲) فقط بخش‌های ناقص (جدیدتر/قدیمی‌تر از داده‌ی موجود) دانلود می‌شود
      - name: Download data (فقط بخش‌های ناقص)
        run: |
          python -u "download_${EXCHANGE}_data.py" \
            --end "${{ inputs.end_date }}" --days "${{ inputs.days }}" --out "data/$EXCHANGE"

      # ۳) بلافاصله بعد از دانلود در Release ذخیره می‌شود، حتی اگر بک‌تست خطا بدهد
      - name: Save data to Release
        if: always() && hashFiles('Backtest/data/**') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -cf "/tmp/$DATA_ASSET" -C "data/$EXCHANGE" .
          ls -lh "/tmp/$DATA_ASSET"
          gh release view "$DATA_RELEASE" --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "$DATA_RELEASE" --repo "${{ github.repository }}" \
              --title "$EXCHANGE data cache" --notes "کش داده‌ی کندل $EXCHANGE برای بک‌تست. حذف نکن." \
              --prerelease --latest=false
          gh release upload "$DATA_RELEASE" "/tmp/$DATA_ASSET" --repo "${{ github.repository }}" --clobber

      - name: Run backtest
        env:
          OVERRIDES: ${{ inputs.overrides }}
          BOTS: ${{ inputs.bots }}
          TOP_LIQUID: ${{ inputs.top_liquid }}
        run: |
          EXTRA=""
          [ -n "$OVERRIDES" ] && EXTRA="$EXTRA --set $OVERRIDES"
          [ -n "$BOTS" ] && EXTRA="$EXTRA --bots $BOTS"
          [ -n "$TOP_LIQUID" ] && EXTRA="$EXTRA --top-liquid $TOP_LIQUID"
          python -u backtest_bots.py --exchange "$EXCHANGE" --data-dir "data/$EXCHANGE" \
            --days "${{ inputs.days }}" --end "${{ inputs.end_date }}" \
            --step-minutes "${{ inputs.step_minutes }}" $EXTRA | tee report_full.txt
          sed -n '/نتایج بک‌تست/,$p' report_full.txt > report.txt
          { echo "exchange: $EXCHANGE | overrides: ${OVERRIDES:-none} | bots: ${BOTS:-all} | top_liquid: ${TOP_LIQUID:-all}"; echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Random-entry baseline (Monte Carlo)
        if: ${{ inputs.random_baseline != '' }}
        run: |
          python -u random_baseline.py --trades backtest_results/trades.csv \
            --exchange "$EXCHANGE" --data-dir "data/$EXCHANGE" \
            --end "${{ inputs.end_date }}" --days "${{ inputs.days }}" \
            --sims 500 --out report_random.txt
          cat report_random.txt >> report.txt
          { echo '```'; cat report_random.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: |
            Backtest/backtest_results/
            Backtest/report.txt
          if-no-files-found: error
