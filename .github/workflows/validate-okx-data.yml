
name: Validate OKX Dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas tabulate

      - name: Download OKX dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download okx-data \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_data.tar" \
            --dir /tmp

          mkdir -p Backtest/data/okx
          tar -xf /tmp/okx_data.tar -C Backtest/data/okx

      - name: Validate dataset
        run: |
          python - <<'PY'
          import gzip
          import glob
          import os
          import pandas as pd
          from datetime import datetime, timezone

          BAR_MS = 15 * 60 * 1000
          EXPECTED_START = int(datetime(2024, 9, 18, tzinfo=timezone.utc).timestamp() * 1000)
          EXPECTED_END = int(datetime(2026, 11, 17, tzinfo=timezone.utc).timestamp() * 1000)
          EXPECTED_SLOTS = (EXPECTED_END - EXPECTED_START) // BAR_MS

          files = sorted(glob.glob("Backtest/data/okx/15m/*.csv.gz"))

          if not files:
              raise SystemExit("ERROR: No dataset files found")

          results = []

          for path in files:
              symbol = os.path.basename(path).replace(".csv.gz", "")

              try:
                  df = pd.read_csv(path, compression="gzip")

                  required = ["ts", "open", "high", "low", "close", "vol"]
                  missing_columns = [c for c in required if c not in df.columns]

                  if missing_columns:
                      raise ValueError(f"Missing columns: {missing_columns}")

                  for col in required:
                      df[col] = pd.to_numeric(df[col], errors="coerce")

                  ts = df["ts"].dropna().astype("int64")
                  duplicates = int(ts.duplicated().sum())
                  out_of_order = int((ts.diff().dropna() < 0).sum())

                  misaligned = int((ts % BAR_MS != 0).sum())

                  out_of_range = int(
                      ((ts < EXPECTED_START) | (ts >= EXPECTED_END)).sum()
                  )

                  in_range = ts[
                      (ts >= EXPECTED_START) &
                      (ts < EXPECTED_END) &
                      (ts % BAR_MS == 0)
                  ]

                  unique_ts = sorted(set(in_range.tolist()))

                  if unique_ts:
                      first_ts = unique_ts[0]
                      last_ts = unique_ts[-1]

                      leading_missing = max(
                          0, (first_ts - EXPECTED_START) // BAR_MS
                      )

                      trailing_missing = max(
                          0, (EXPECTED_END - BAR_MS - last_ts) // BAR_MS
                      )

                      internal_missing = (
                          (last_ts - first_ts) // BAR_MS + 1 - len(unique_ts)
                      )

                      internal_gaps = sum(
                          1 for a, b in zip(unique_ts, unique_ts[1:])
                          if b - a > BAR_MS
                      )

                      coverage = 100 * len(unique_ts) / EXPECTED_SLOTS

                      start = datetime.fromtimestamp(
                          first_ts / 1000, timezone.utc
                      ).strftime("%Y-%m-%d")

                      end = datetime.fromtimestamp(
                          last_ts / 1000, timezone.utc
                      ).strftime("%Y-%m-%d")
                  else:
                      leading_missing = EXPECTED_SLOTS
                      trailing_missing = EXPECTED_SLOTS
                      internal_missing = 0
                      internal_gaps = 0
                      coverage = 0.0
                      start = "NONE"
                      end = "NONE"

                  ohlc = df[["open", "high", "low", "close"]]
                  invalid_values = int(df[required].isna().any(axis=1).sum())

                  invalid_ohlc = int(
                      (
                          (df["high"] < df[["open", "close", "low"]].max(axis=1)) |
                          (df["low"] > df[["open", "close", "high"]].min(axis=1)) |
                          (df["high"] < df["low"]) |
                          (df[["open", "high", "low", "close"]] <= 0).any(axis=1)
                      ).sum()
                  )

                  invalid_volume = int((df["vol"] < 0).sum())

                  errors = (
                      duplicates + out_of_order + misaligned +
                      out_of_range + internal_missing +
                      invalid_values + invalid_ohlc + invalid_volume
                  )

                  status = "OK" if errors == 0 else "CHECK"

                  results.append({
                      "symbol": symbol,
                      "status": status,
                      "rows": len(df),
                      "start_utc": start,
                      "end_utc": end,
                      "coverage_pct": round(coverage, 2),
                      "leading_missing": leading_missing,
                      "trailing_missing": trailing_missing,
                      "internal_missing": internal_missing,
                      "internal_gaps": internal_gaps,
                      "duplicates": duplicates,
                      "misaligned": misaligned,
                      "out_of_range": out_of_range,
                      "out_of_order": out_of_order,
                      "invalid_ohlc": invalid_ohlc,
                      "invalid_volume": invalid_volume,
                      "invalid_values": invalid_values,
                  })

              except Exception as e:
                  results.append({
                      "symbol": symbol,
                      "status": "ERROR",
                      "error": str(e)
                  })

          report = pd.DataFrame(results)

          os.makedirs("reports", exist_ok=True)
          report.to_csv("reports/okx_quality_report.csv", index=False)

          with open("reports/okx_quality_report.md", "w") as f:
              f.write("# OKX Dataset Quality Report\n\n")
              f.write(f"- Expected start: 2024-09-18 00:00 UTC\n")
              f.write(f"- Expected end (exclusive): 2026-11-17 00:00 UTC\n")
              f.write(f"- Expected 15m candles per full-history symbol: {EXPECTED_SLOTS:,}\n\n")
              f.write("Leading/trailing missing candles and coverage are informational. ")
              f.write("They may reflect a contract listed after the dataset start. ")
              f.write("Internal gaps and invalid data are quality checks.\n\n")
              f.write(report.to_markdown(index=False))

          print(report.to_string(index=False))

          ok = int((report["status"] == "OK").sum())
          check = int((report["status"] == "CHECK").sum())
          error = int((report["status"] == "ERROR").sum())

          print(f"\nOK: {ok} | CHECK: {check} | ERROR: {error}")

          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("# OKX Dataset Quality Report\n\n")
              f.write(f"- OK: {ok}\n- CHECK: {check}\n- ERROR: {error}\n\n")
              f.write(report.to_markdown(index=False))

          if check or error:
              raise SystemExit("Dataset validation failed")
          PY

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: okx-data-quality-report
          path: reports/
          retention-days: 30
