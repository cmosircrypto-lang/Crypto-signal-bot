
name: Validate OKX Dataset

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pandas

      - name: Download OKX dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download okx-data \
            --repo "${{ github.repository }}" \
            --pattern "okx_data.tar" \
            --dir /tmp \
            --clobber

          mkdir -p Backtest/data/okx
          tar -xf /tmp/okx_data.tar -C Backtest/data/okx

          echo "Archive extracted successfully"
          find Backtest/data/okx -type f | head -20

      - name: Validate candle data
        run: |
          cd Backtest
          python - <<'PY'
          import os, glob
          import pandas as pd
          from datetime import datetime, timezone

          root = "data/okx/15m"
          files = sorted(glob.glob(root + "/*.csv.gz"))
          bar = 15 * 60 * 1000
          rows = []

          for path in files:
              symbol = os.path.basename(path).replace(".csv.gz", "")
              result = {
                  "symbol": symbol,
                  "rows": 0,
                  "unique": 0,
                  "start": "",
                  "end": "",
                  "duplicates": 0,
                  "missing": 0,
                  "gaps": 0,
                  "invalid_ohlc": 0,
                  "invalid_volume": 0,
                  "invalid_values": 0,
                  "out_of_order": 0,
                  "status": "OK",
                  "notes": ""
              }

              try:
                  df = pd.read_csv(path)
                  required = ["ts", "open", "high", "low", "close", "volume"]

                  if not set(required).issubset(df.columns):
                      raise ValueError("Missing required columns")

                  result["rows"] = len(df)

                  ts = pd.to_numeric(df["ts"], errors="coerce")
                  prices = df[["open", "high", "low", "close", "volume"]].apply(
                      pd.to_numeric, errors="coerce"
                  )

                  result["invalid_values"] = int(
                      ts.isna().sum() + prices.isna().sum().sum()
                  )

                  valid_ts = ts.dropna().astype("int64")
                  result["out_of_order"] = int(
                      (valid_ts.diff().dropna() < 0).sum()
                  )
                  result["duplicates"] = int(valid_ts.duplicated().sum())

                  unique_ts = sorted(set(valid_ts.tolist()))
                  result["unique"] = len(unique_ts)

                  if unique_ts:
                      first, last = unique_ts[0], unique_ts[-1]

                      result["start"] = datetime.fromtimestamp(
                          first / 1000, timezone.utc
                      ).strftime("%Y-%m-%d %H:%M")

                      result["end"] = datetime.fromtimestamp(
                          last / 1000, timezone.utc
                      ).strftime("%Y-%m-%d %H:%M")

                      expected = (last - first) // bar + 1
                      result["missing"] = max(0, expected - len(unique_ts))

                      result["gaps"] = sum(
                          1 for a, b in zip(unique_ts, unique_ts[1:])
                          if b - a > bar
                      )

                  o, h, l, c, v = (
                      prices[x] for x in
                      ["open", "high", "low", "close", "volume"]
                  )

                  valid = prices.notna().all(axis=1)

                  bad_ohlc = valid & (
                      (l <= 0) | (h < l) | (h < o) |
                      (h < c) | (l > o) | (l > c)
                  )

                  result["invalid_ohlc"] = int(bad_ohlc.sum())
                  result["invalid_volume"] = int(
                      (valid & (v < 0)).sum()
                  )

                  problems = [
                      f"{k}={result[k]}"
                      for k in [
                          "duplicates", "missing", "gaps",
                          "invalid_ohlc", "invalid_volume",
                          "invalid_values", "out_of_order"
                      ]
                      if result[k] > 0
                  ]

                  if not unique_ts:
                      problems.append("no valid timestamps")

                  if problems:
                      result["status"] = "CHECK"
                      result["notes"] = "; ".join(problems)

              except Exception as exc:
                  result["status"] = "ERROR"
                  result["notes"] = str(exc)

              rows.append(result)

          report = pd.DataFrame(rows)
          report.to_csv("data_quality_report.csv", index=False)

          ok = sum(x["status"] == "OK" for x in rows)
          check = sum(x["status"] == "CHECK" for x in rows)
          error = sum(x["status"] == "ERROR" for x in rows)

          with open("data_quality_report.md", "w", encoding="utf-8") as f:
              f.write("# OKX Dataset Quality Report\n\n")
              f.write(f"- Files: {len(rows)}\n")
              f.write(f"- OK: {ok}\n")
              f.write(f"- CHECK: {check}\n")
              f.write(f"- ERROR: {error}\n\n")
              f.write(report.to_markdown(index=False))

          print(f"Files: {len(rows)} | OK: {ok} | CHECK: {check} | ERROR: {error}")
          print(report.to_string(index=False))
          PY

      - name: Add report to summary
        if: always()
        run: |
          if [ -f Backtest/data_quality_report.md ]; then
            cat Backtest/data_quality_report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload quality reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: okx-data-quality-report
          path: |
            Backtest/data_quality_report.md
            Backtest/data_quality_report.csv
          if-no-files-found: warn
