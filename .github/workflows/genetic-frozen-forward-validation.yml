name: Frozen Genetic Champion Forward Validation

on:
  push:
    branches:
      - experiment/genetic-frozen-forward-validation
  workflow_dispatch:
    inputs:
      genetic_source_run_id:
        description: Completed genetic run whose eligible champions are frozen
        required: true
        default: "45054615629"
        type: string
      genetic_source_commit_sha:
        description: Expected source genetic commit SHA
        required: true
        default: "16544a09a07ce024f07037cb0ca65c1fbd18cf57"
        type: string
      forward_data_run_id:
        description: Successful forward-data refresh run
        required: true
        default: "45076388584"
        type: string

permissions:
  contents: read
  actions: read

jobs:
  preflight:
    name: Compile and test the frozen validation code
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Compile and run focused regression tests
        run: |
          python -m compileall -q Backtest/GeneticEngine
          python -m unittest \
            Backtest.GeneticEngine.tests.test_genome \
            Backtest.GeneticEngine.tests.test_family_signals \
            Backtest.GeneticEngine.tests.test_historical_evaluator \
            Backtest.GeneticEngine.tests.test_genetic_runner \
            Backtest.GeneticEngine.tests.test_dynamic_selection \
            Backtest.GeneticEngine.tests.test_forward_validation

      - name: Freeze and verify the exact 11 source champions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.genetic_source_run_id || '45054615629' }}
          SOURCE_COMMIT_SHA: ${{ inputs.genetic_source_commit_sha || '16544a09a07ce024f07037cb0ca65c1fbd18cf57' }}
        run: |
          set -euo pipefail
          source_meta="$(gh run view "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch,headSha,status,conclusion)"
          test "$(echo "$source_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["headBranch"])')" = "experiment/dynamic-signal-selection-design"
          test "$(echo "$source_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["headSha"])')" = "$SOURCE_COMMIT_SHA"
          test "$(echo "$source_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "completed"
          test "$(echo "$source_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')" = "success"
          mkdir -p /tmp/genetic-source
          gh run download "$SOURCE_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/genetic-source
          summary_count="$(find /tmp/genetic-source -type f -name 'genetic_family_summary_*.json' | wc -l)"
          test "$summary_count" -eq 12
          python -m Backtest.GeneticEngine.freeze_candidates \
            --artifact-root /tmp/genetic-source \
            --source-run-id "$SOURCE_RUN_ID" \
            --source-commit-sha "$SOURCE_COMMIT_SHA" \
            --output Backtest/GeneticEngine/frozen_candidates.json
          python -c 'import json; p=json.load(open("Backtest/GeneticEngine/frozen_candidates.json")); assert len(p["candidates"]) == 11; assert len(p["excluded"]) == 1; print("Frozen candidate manifest: 11 eligible, 1 excluded")'

      - name: Publish frozen candidate manifest for downstream validation
        uses: actions/upload-artifact@v4
        with:
          name: frozen-candidate-manifest
          path: Backtest/GeneticEngine/frozen_candidates.json
          if-no-files-found: error
          retention-days: 2

  frozen-forward-validation:
    name: Validate 11 frozen candidates on new forward data
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[run-forward]')
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas

      - name: Retrieve preflight-frozen candidate manifest
        uses: actions/download-artifact@v4
        with:
          name: frozen-candidate-manifest
          path: Backtest/GeneticEngine

      - name: Verify and download the validated forward dataset
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_RUN_ID: ${{ inputs.forward_data_run_id || '45076388584' }}
        run: |
          set -euo pipefail
          data_meta="$(gh run view "$DATA_RUN_ID" --repo "$GITHUB_REPOSITORY" --json headBranch,status,conclusion)"
          echo "$data_meta"
          test "$(echo "$data_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["headBranch"])')" = "experiment/genetic-forward-data-refresh"
          test "$(echo "$data_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["status"])')" = "completed"
          test "$(echo "$data_meta" | python -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')" = "success"
          mkdir -p /tmp/forward-data Backtest/data/okx reports
          gh run download "$DATA_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name genetic-forward-okx-dataset --dir /tmp/forward-data
          test -f /tmp/forward-data/reports/forward_data_quality.json
          test -d /tmp/forward-data/Backtest/data/okx/15m
          cp -a /tmp/forward-data/Backtest/data/okx/. Backtest/data/okx/
          cp /tmp/forward-data/reports/forward_data_quality.json reports/forward_data_quality.json
          cp /tmp/forward-data/reports/forward_data_quality.csv reports/forward_data_quality.csv

      - name: Run frozen forward-only validation
        run: |
          set -euo pipefail
          python -u -m Backtest.GeneticEngine.run_frozen_forward_validation \
            --data-root Backtest/data/okx \
            --quality-report reports/forward_data_quality.json \
            --manifest Backtest/GeneticEngine/frozen_candidates.json \
            --output-dir Backtest/results/genetic_frozen_forward

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genetic-frozen-forward-validation
          path: |
            Backtest/GeneticEngine/frozen_candidates.json
            Backtest/results/genetic_frozen_forward/
            reports/forward_data_quality.json
          if-no-files-found: warn
          retention-days: 30

  two-year-frozen-replay:
    name: Replay 11 frozen champions over two-year OKX history
    if: contains(github.event.head_commit.message, '[run-two-year]') || github.event_name == 'workflow_dispatch'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - name: Checkout isolated validation branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy pandas
      - name: Retrieve exact frozen candidate manifest
        uses: actions/download-artifact@v4
        with:
          name: frozen-candidate-manifest
          path: Backtest/GeneticEngine
      - name: Restore historical OKX dataset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/okx-cache Backtest/data/okx reports
          gh release download okx-data --repo "$GITHUB_REPOSITORY" --pattern "okx_data.tar" --dir /tmp/okx-cache
          gh release download okx-data --repo "$GITHUB_REPOSITORY" --pattern "okx_timeframes.tar" --dir /tmp/okx-cache
          tar -xf /tmp/okx-cache/okx_data.tar -C Backtest/data/okx
          tar -xf /tmp/okx-cache/okx_timeframes.tar -C Backtest/data/okx
          for timeframe in 15m 1h 4h; do
            count="$(find "Backtest/data/okx/$timeframe" -maxdepth 1 -name '*.csv.gz' | wc -l)"
            echo "$timeframe: $count symbol files"
            test "$count" -eq 76
          done
      - name: Compile and run regression tests
        run: |
          set -euo pipefail
          python -m compileall -q Backtest/GeneticEngine
          python -m unittest \
            Backtest.GeneticEngine.tests.test_genome \
            Backtest.GeneticEngine.tests.test_family_signals \
            Backtest.GeneticEngine.tests.test_historical_evaluator \
            Backtest.GeneticEngine.tests.test_genetic_runner \
            Backtest.GeneticEngine.tests.test_dynamic_selection \
            Backtest.GeneticEngine.tests.test_forward_validation
      - name: Record dataset coverage
        run: |
          set -euo pipefail
          PYTHONPATH=Backtest/SwingEngine python - <<'PY'
          from data_loader import load_okx_data, dataset_report
          data = load_okx_data("Backtest/data/okx", expected_symbols=76)
          report = dataset_report(data)
          report.to_csv("reports/okx_dataset_coverage.csv", index=False)
          print(report.groupby("timeframe").agg(
              symbols=("symbol", "nunique"),
              min_first=("first_open_utc", "min"),
              max_last=("last_close_utc", "max"),
              min_candles=("candles", "min"),
              max_candles=("candles", "max"),
          ).to_string())
          PY
      - name: Run immutable two-year replay with final 15% holdout isolated
        run: |
          set -euo pipefail
          python -u -m Backtest.GeneticEngine.run_two_year_frozen_replay \
            --data-root Backtest/data/okx \
            --manifest Backtest/GeneticEngine/frozen_candidates.json \
            --output-dir Backtest/results/genetic_two_year_replay
      - name: Publish two-year reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genetic-frozen-two-year-replay
          path: |
            Backtest/GeneticEngine/frozen_candidates.json
            Backtest/results/genetic_two_year_replay/
            reports/okx_dataset_coverage.csv
          if-no-files-found: warn
          retention-days: 30
