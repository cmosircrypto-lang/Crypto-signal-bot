
name: Swing Engine Market Structure Test

on:
  workflow_dispatch:
  push:
    paths:
      - "Backtest/SwingEngine/**"
      - ".github/workflows/test-swing-engine.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run Market Structure Tests
        run: |
          python Backtest/SwingEngine/test_market_structure.py
