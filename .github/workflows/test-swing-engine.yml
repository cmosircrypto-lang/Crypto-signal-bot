name: Swing Engine Tests

on:
  workflow_dispatch:
    inputs:
      run_full_backtest:
        description: "After tests, run the 9-combination backtest on the cached 76-symbol OKX dataset"
        required: true
        type: boolean
        default: false
      legacy_sizing:
        description: "Use theoretical base-quantity sizing instead of OKX contract lot/minimum rules"
        required: true
        type: boolean
        default: false
      require_4h_alignment:
        description: "Require 4h trend alignment for entries"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Market Structure Tests
        run: python Backtest/SwingEngine/test_market_structure.py

      - name: Run Order Block Tests
        run: python Backtest/SwingEngine/test_order_block.py

      - name: Run Order Block Touch Rules Tests
        run: python Backtest/SwingEngine/test_ob_touch_rules.py

      - name: Run Order Block Zone Tests
        run: python Backtest/SwingEngine/test_ob_zone_rules.py

      - name: Test execution engine
        run: python Backtest/SwingEngine/test_execution_engine.py

      - name: Test portfolio engine
        run: python Backtest/SwingEngine/test_portfolio_engine.py

      - name: Test integrated trading system
        run: python Backtest/SwingEngine/test_trading_system.py

      - name: Test OKX contract specifications
        run: python Backtest/SwingEngine/test_okx_contract_specs.py

      - name: Test signal engine
        run: python Backtest/SwingEngine/test_signal_engine.py

      - name: Test chronological backtest runner
        run: python Backtest/SwingEngine/test_backtest_runner.py

      - name: Download validated OKX datasets
        if: ${{ inputs.run_full_backtest }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_data.tar" --dir /tmp
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_timeframes.tar" --dir /tmp
          mkdir -p Backtest/data/okx
          tar -xf /tmp/okx_data.tar -C Backtest/data/okx
          tar -xf /tmp/okx_timeframes.tar -C Backtest/data/okx
          for timeframe in 15m 1h 4h; do
            count=$(find "Backtest/data/okx/$timeframe" -maxdepth 1 -name '*.csv.gz' | wc -l)
            echo "$timeframe: $count symbol files"
            test "$count" -eq 76
          done

      - name: Run nine-combination backtest
        if: ${{ inputs.run_full_backtest }}
        run: |
          EXTRA=""
          if [ "${{ inputs.legacy_sizing }}" = "true" ]; then
            EXTRA="$EXTRA --legacy-sizing"
          fi
          if [ "${{ inputs.require_4h_alignment }}" = "true" ]; then
            EXTRA="$EXTRA --require-4h-alignment"
          fi
          python -u Backtest/SwingEngine/backtest_runner.py $EXTRA | tee /tmp/swing-backtest.log

      - name: Add backtest summary
        if: ${{ always() && inputs.run_full_backtest }}
        run: |
          if [ -f /tmp/swing-backtest.log ]; then
            {
              echo "## Swing Engine — 9 combinations"
              tail -n 80 /tmp/swing-backtest.log
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backtest results
        if: ${{ always() && inputs.run_full_backtest }}
        uses: actions/upload-artifact@v4
        with:
          name: swing-engine-9-combination-results
          path: |
            Backtest/results/swing_engine/
            /tmp/swing-backtest.log
          if-no-files-found: warn
          retention-days: 30
