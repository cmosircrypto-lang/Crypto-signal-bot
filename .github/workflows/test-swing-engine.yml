name: Swing Engine Tests

on:
  workflow_dispatch:
    inputs:
      run_full_backtest:
        description: "After tests, run 36 BTC-filtered risk/RR scenarios on the cached 76-symbol OKX dataset"
        required: true
        type: boolean
        default: false
      legacy_sizing:
        description: "Use theoretical base-quantity sizing instead of OKX contract lot/minimum rules"
        required: true
        type: boolean
        default: false
      require_4h_alignment:
        description: "Require 4h trend alignment for entries"
        required: true
        type: boolean
        default: false
      run_btc_trend_analysis:
        description: "Analyze Run #35 executed entries against BTC 1d, 4h and 1h trends"
        required: true
        type: boolean
        default: false
      run_symbol_filter_experiment:
        description: "Run chronological train/OOS comparison of all, weak-excluded and strong-only symbol universes"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Market Structure Tests
        run: python Backtest/SwingEngine/test_market_structure.py

      - name: Run Order Block Tests
        run: python Backtest/SwingEngine/test_order_block.py

      - name: Run Order Block Touch Rules Tests
        run: python Backtest/SwingEngine/test_ob_touch_rules.py

      - name: Run Order Block Zone Tests
        run: python Backtest/SwingEngine/test_ob_zone_rules.py

      - name: Test execution engine
        run: python Backtest/SwingEngine/test_execution_engine.py

      - name: Test portfolio engine
        run: python Backtest/SwingEngine/test_portfolio_engine.py

      - name: Test integrated trading system
        run: python Backtest/SwingEngine/test_trading_system.py

      - name: Test OKX contract specifications
        run: python Backtest/SwingEngine/test_okx_contract_specs.py

      - name: Test signal engine
        run: python Backtest/SwingEngine/test_signal_engine.py

      - name: Test chronological backtest runner
        run: python Backtest/SwingEngine/test_backtest_runner.py

      - name: Test chronological symbol-filter experiment
        run: python Backtest/SwingEngine/test_symbol_filter_experiment.py

      - name: Download validated OKX datasets
        if: ${{ inputs.run_full_backtest || inputs.run_symbol_filter_experiment }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_data.tar" --dir /tmp
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_timeframes.tar" --dir /tmp
          mkdir -p Backtest/data/okx
          tar -xf /tmp/okx_data.tar -C Backtest/data/okx
          tar -xf /tmp/okx_timeframes.tar -C Backtest/data/okx
          for timeframe in 15m 1h 4h; do
            count=$(find "Backtest/data/okx/$timeframe" -maxdepth 1 -name '*.csv.gz' | wc -l)
            echo "$timeframe: $count symbol files"
            test "$count" -eq 76
          done

      - name: Run 36 BTC-filtered backtest scenarios
        if: ${{ inputs.run_full_backtest }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ "${{ inputs.legacy_sizing }}" = "true" ]; then
            EXTRA="$EXTRA --legacy-sizing"
          fi
          if [ "${{ inputs.require_4h_alignment }}" = "true" ]; then
            EXTRA="$EXTRA --require-4h-alignment"
          fi
          python -u Backtest/SwingEngine/backtest_runner.py $EXTRA | tee /tmp/swing-backtest.log

      - name: Run chronological symbol-filter OOS experiment
        if: ${{ inputs.run_symbol_filter_experiment }}
        run: |
          set -o pipefail
          python -u Backtest/SwingEngine/symbol_filter_experiment.py | tee /tmp/symbol-filter-experiment.log

      - name: Add symbol-filter experiment summary
        if: ${{ always() && inputs.run_symbol_filter_experiment }}
        run: |
          if [ -f Backtest/results/symbol_filter_experiment/README.md ]; then
            cat Backtest/results/symbol_filter_experiment/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f /tmp/symbol-filter-experiment.log ]; then
            tail -n 60 /tmp/symbol-filter-experiment.log >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload symbol-filter experiment results
        if: ${{ always() && inputs.run_symbol_filter_experiment }}
        uses: actions/upload-artifact@v4
        with:
          name: swing-engine-symbol-filter-oos-experiment
          path: |
            Backtest/results/symbol_filter_experiment/
            /tmp/symbol-filter-experiment.log
          if-no-files-found: warn
          retention-days: 30

      - name: Add backtest summary
        if: ${{ always() && inputs.run_full_backtest }}
        run: |
          if [ -f /tmp/swing-backtest.log ]; then
            {
              echo "## Swing Engine — 36 BTC-filtered scenarios"
              tail -n 80 /tmp/swing-backtest.log
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backtest results
        if: ${{ always() && inputs.run_full_backtest }}
        uses: actions/upload-artifact@v4
        with:
          name: swing-engine-btc-filter-36-scenarios
          path: |
            Backtest/results/swing_engine/
            /tmp/swing-backtest.log
          if-no-files-found: warn
          retention-days: 30

  analyze_btc_trend_run35:
    if: ${{ inputs.run_btc_trend_analysis }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install analysis dependencies
        run: pip install pandas numpy

      - name: Download Run #35 trade artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/14583156339/zip" \
            -o run35-results.zip
          unzip -t run35-results.zip

      - name: Download BTC historical candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_data.tar" --dir /tmp
          gh release download okx-data --repo "${GITHUB_REPOSITORY}" \
            --pattern "okx_timeframes.tar" --dir /tmp
          mkdir -p Backtest/data/okx
          tar -xf /tmp/okx_data.tar -C Backtest/data/okx
          tar -xf /tmp/okx_timeframes.tar -C Backtest/data/okx
          test -d Backtest/data/okx/1h
          test -d Backtest/data/okx/4h
          echo "Daily BTC candles will be aggregated from 24 complete UTC-aligned 1h candles."
          find Backtest/data/okx/1h -maxdepth 1 -iname '*BTC*USDT*SWAP*.csv.gz' -print
          find Backtest/data/okx/4h -maxdepth 1 -iname '*BTC*USDT*SWAP*.csv.gz' -print

      - name: Compare entries with BTC 1d, 4h and 1h trend
        run: python Backtest/SwingEngine/analyze_btc_trend_run35.py

      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f btc_trend_alignment_run35/README.md ]; then
            cat btc_trend_alignment_run35/README.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload BTC trend alignment report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc-trend-alignment-run35
          path: btc_trend_alignment_run35/
          if-no-files-found: warn
          retention-days: 30
