name: Swing Engine Tests

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy

      - name: Run Market Structure Tests
        run: python Backtest/SwingEngine/test_market_structure.py

      - name: Run Order Block Tests
        run: python Backtest/SwingEngine/test_order_block.py

      - name: Run Order Block Touch Rules Tests
        run: python Backtest/SwingEngine/test_ob_touch_rules.py

      - name: Run Order Block Zone Tests
        run: python Backtest/SwingEngine/test_ob_zone_rules.py

      - name: Test execution engine
        run: python Backtest/SwingEngine/test_execution_engine.py

      - name: Test portfolio engine
        run: python Backtest/SwingEngine/test_portfolio_engine.py

      - name: Test integrated trading system
        run: python Backtest/SwingEngine/test_trading_system.py

      - name: Test OKX contract specifications
        run: python Backtest/SwingEngine/test_okx_contract_specs.py

      - name: Test signal engine
        run: python Backtest/SwingEngine/test_signal_engine.py

      - name: Test chronological backtest runner
        run: python Backtest/SwingEngine/test_backtest_runner.py
